name: Build Android APK
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web App
        env:
          USE_SIMULATION: "false"
          VITE_BACKEND_URL: "https://yemen-ai-app-2.onrender.com"
        run: npm run build

      - name: Install Capacitor Core and CLI
        run: npm install @capacitor/cli @capacitor/android @capacitor/core --legacy-peer-deps

      - name: Add Android Platform
        run: |
          rm -rf android
          npx @capacitor/cli add android
          npx @capacitor/cli sync

      - name: Fix Kotlin Duplicate Classes Conflict
        run: |
          echo "configurations.all { exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'; exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8' }" >> android/app/build.gradle

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: yemen-ai-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
