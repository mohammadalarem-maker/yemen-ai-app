name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install All Dependencies
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android
      - name: Build Web App
        env:
          USE_SIMULATION: "true"
        run: npm run build
      - name: Add Android Platform
        run: |
          rm -rf android
          npx cap add android --force
      - name: Sync Capacitor
        run: npx cap sync
      - name: Fix Kotlin Duplicate Classes Conflict
        run: |
          echo "configurations.all { exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'; exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8' }" >> android/app/build.gradle
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: yemen-ai-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk